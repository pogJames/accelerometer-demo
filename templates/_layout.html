<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}npu-classifier{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<script>
  // Pre-paint <html lang> so :lang() selectors apply before i18n.js runs.
  (function () {
    var saved = localStorage.getItem('lang') === 'zh-Hant' ? 'zh-Hant' : 'en';
    document.documentElement.lang = saved;
  })();
</script>
{% block head %}{% endblock %}
</head>
<body>
<div class="app">
  <header class="header">
    <a class="brand" href="{{ url_for('index') }}">
      <img class="brand-mark" src="{{ url_for('static', filename='logo.png') }}" alt="logo">
    </a>
    <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Toggle language">EN</button>
  </header>

  <aside class="sidebar">
    <nav class="nav">
      <a class="nav-item {% if active_page == 'live' %}active{% endif %}" href="{{ url_for('index') }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        <span>Live inference</span>
      </a>
      <a class="nav-item {% if active_page == 'record' %}active{% endif %}" href="{{ url_for('record_page') }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
        <span>Data recording</span>
      </a>
      <a class="nav-item {% if active_page == 'train' %}active{% endif %}" href="{{ url_for('train_page') }}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 4 3 6 3s6-1 6-3v-5"/>
        </svg>
        <span>Train model</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="meta-row">
        <span>inference</span>
        <span class="badge {{ inference_mode }}" id="sidebar-mode">{{ inference_mode }}</span>
      </div>
      <div class="meta-row">
        <span>sensors</span>
        <span style="font-variant-numeric: tabular-nums;">{{ ports|length }}</span>
      </div>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
